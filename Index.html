<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flappy Bird - Enhanced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 360px;
            height: 640px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #loadingScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        #loadingText {
            color: white;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        #progressBar {
            width: 80%;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            overflow: hidden;
        }
        
        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #00b4db, #0083b0);
            transition: width 0.3s;
        }
        
        #gameCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        #menuScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        
        #gameTitle {
            font-size: 42px;
            margin-bottom: 20px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #FF4500;
        }
        
        #bestScore {
            font-size: 24px;
            margin-bottom: 30px;
            color: #4CAF50;
        }
        
        .menuButton {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: none;
            color: white;
            padding: 12px 30px;
            margin: 10px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            width: 200px;
            box-shadow: 0 4px 0 #1B5E20;
            transition: all 0.2s;
        }
        
        .menuButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1B5E20;
        }
        
        .menuButton:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1B5E20;
        }
        
        #customizationScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 20;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        
        .customizationTitle {
            font-size: 28px;
            margin: 15px 0;
            color: #FFD700;
            text-align: center;
        }
        
        .colorOptions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0 20px 0;
            max-width: 300px;
        }
        
        .colorOption {
            width: 40px;
            height: 40px;
            margin: 5px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .colorOption:hover {
            transform: scale(1.1);
        }
        
        .colorOption.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }
        
        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 40px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 5;
            display: none;
        }
        
        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 15;
            color: white;
        }
        
        #finalScore {
            font-size: 60px;
            color: #FFD700;
            margin: 10px 0;
        }
        
        #newBestScore {
            font-size: 24px;
            color: #4CAF50;
            margin-bottom: 20px;
            display: none;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            text-align: center;
            color: white;
            font-size: 16px;
            width: 100%;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .soundToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 25;
        }
        
        .modeOption {
            width: 80px;
            height: 80px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-align: center;
        }
        
        .modeOption:hover {
            transform: scale(1.05);
        }
        
        .modeOption.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }
        
        .modeOptions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0 20px 0;
            max-width: 300px;
        }
        
        .difficultyOption {
            width: 100px;
            height: 60px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        
        .difficultyOption:hover {
            transform: scale(1.05);
        }
        
        .difficultyOption.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }
        
        #difficultyEasy {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
        }
        
        #difficultyMedium {
            background: linear-gradient(to bottom, #FF9800, #F57C00);
        }
        
        #difficultyHard {
            background: linear-gradient(to bottom, #F44336, #D32F2F);
        }
        
        .backgroundOption {
            width: 80px;
            height: 60px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        
        .backgroundOption:hover {
            transform: scale(1.05);
        }
        
        .backgroundOption.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }
        
        .sizeOption {
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            text-align: center;
            background: linear-gradient(to bottom, #2196F3, #1976D2);
        }
        
        .sizeOption:hover {
            transform: scale(1.05);
        }
        
        .sizeOption.selected {
            border-color: white;
            box-shadow: 0 0 10px white;
        }
        
        .sizeIcon {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <div id="loadingText">Loading Flappy Bird 3D</div>
            <div id="progressBar">
                <div id="progress"></div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <button id="soundToggle" class="soundToggle">🔊</button>
        
        <div id="scoreDisplay">0</div>
        
        <div id="menuScreen">
            <h1 id="gameTitle">Flappy Bird 3D</h1>
            <div id="bestScore">Best Score: 0</div>
            <button class="menuButton" id="startButton">Start Game</button>
            <button class="menuButton" id="customizeButton">Customize</button>
        </div>
        
        <div id="customizationScreen">
            <h2 class="customizationTitle">Difficulty Level</h2>
            <div class="modeOptions" id="difficultyOptions">
                <div class="difficultyOption selected" id="difficultyEasy">Easy</div>
                <div class="difficultyOption" id="difficultyMedium">Medium</div>
                <div class="difficultyOption" id="difficultyHard">Hard</div>
            </div>
            
            <h2 class="customizationTitle">Game Mode</h2>
            <div class="modeOptions" id="gameModes">
                <!-- Game mode options will be generated by JavaScript -->
            </div>
            
            <h2 class="customizationTitle">Background Theme</h2>
            <div class="modeOptions" id="backgroundOptions">
                <!-- Background options will be generated by JavaScript -->
            </div>
            
            <h2 class="customizationTitle">Bird Size</h2>
            <div class="modeOptions" id="birdSizes">
                <!-- Bird size options will be generated by JavaScript -->
            </div>
            
            <h2 class="customizationTitle">Customize Bird Color</h2>
            <div class="colorOptions" id="birdColors">
                <!-- Bird color options will be generated by JavaScript -->
            </div>
            
            <h2 class="customizationTitle">Customize Pipe Color</h2>
            <div class="colorOptions" id="pipeColors">
                <!-- Pipe color options will be generated by JavaScript -->
            </div>
            
            <button class="menuButton" id="backButton">Back to Menu</button>
        </div>
        
        <div id="gameOverScreen">
            <h2>Game Over!</h2>
            <div id="finalScore">0</div>
            <div id="newBestScore">New Best Score!</div>
            <button class="menuButton" id="restartButton">Play Again</button>
            <button class="menuButton" id="menuButton">Main Menu</button>
        </div>
        
        <div id="instructions">
            Tap or press SPACE to flap wings
        </div>
    </div>

    <script>
        // Game variables
        let canvas, ctx;
        let gameActive = false;
        let score = 0;
        let bestScore = localStorage.getItem('flappyBirdBestScore') || 0;
        let frames = 0;
        let soundEnabled = true;
        let currentMode = 'day'; // 'day', 'night', 'rain'
        let currentDifficulty = 'easy'; // 'easy', 'medium', 'hard'
        let currentBackground = 'gradient'; // 'gradient', 'mountain', 'city', 'space'
        let currentBirdSize = 'medium'; // 'small', 'medium', 'large'
        
        // Bird properties (normalized values)
        let bird = {
            x: 50,
            y: 150,
            width: 40,
            height: 30,
            gravity: 0.15,  // Reduced gravity for smoother gameplay
            lift: -5.5,     // Reduced lift for better control
            velocity: 0,
            rotation: 0,
            color: '#FFD700' // Default gold color
        };
        
        // Bird size options
        const birdSizeOptions = [
            { id: 'small', name: 'Small', width: 30, height: 22, gravity: 0.12, lift: -4.5 },
            { id: 'medium', name: 'Medium', width: 40, height: 30, gravity: 0.15, lift: -5.5 },
            { id: 'large', name: 'Large', width: 50, height: 38, gravity: 0.18, lift: -6.5 }
        ];
        
        // Pipes properties
        let pipes = [];
        let pipeWidth = 60;
        let pipeGap = 150;
        let pipeFrequency = 100;
        let pipeSpeed = 2;
        let pipeColor = '#4CAF50'; // Default green color
        
        // Background properties for different modes
        let backgroundColorTop = '#87CEEB';
        let backgroundColorBottom = '#E0F7FF';
        
        // Rain properties
        let raindrops = [];
        
        // Ground properties - Made smaller and solid green
        let ground = {
            y: 580,  // Increased from 500 to make ground smaller (higher up)
            height: 60  // Reduced from 140 to make ground smaller
        };
        
        // Sound effects
        let flapSound, hitSound, pointSound;
        
        // Color options
        const birdColorOptions = [
            '#FFD700', '#FF4500', '#1E90FF', '#32CD32', 
            '#8A2BE2', '#FF1493', '#00CED1', '#FF6347',
            '#7CFC00', '#DA70D6', '#F0E68C', '#FFFFFF'
        ];
        
        const pipeColorOptions = [
            '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B',
            '#FF9800', '#FF5722', '#795548', '#607D8B',
            '#9C27B0', '#3F51B5', '#2196F3', '#00BCD4'
        ];
        
        // Game modes
        const gameModes = [
            { id: 'day', name: 'Day', top: '#87CEEB', bottom: '#E0F7FF' },
            { id: 'night', name: 'Night', top: '#0f2027', bottom: '#203a43' },
            { id: 'rain', name: 'Rain', top: '#606c88', bottom: '#3f4c6b' }
        ];
        
        // Background themes
        const backgroundThemes = [
            { id: 'gradient', name: 'Gradient', top: '#87CEEB', bottom: '#E0F7FF' },
            { id: 'mountain', name: 'Mountain', top: '#4A90E2', bottom: '#7B9E87' },
            { id: 'city', name: 'City', top: '#636FA4', bottom: '#E8CBC0' },
            { id: 'space', name: 'Space', top: '#0F2027', bottom: '#2C5364' }
        ];
        
        // Initialize the game
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas dimensions
            canvas.width = 360;
            canvas.height = 640;
            
            // Create color options
            createColorOptions();
            
            // Create game mode options
            createModeOptions();
            
            // Create background options
            createBackgroundOptions();
            
            // Create bird size options
            createBirdSizeOptions();
            
            // Set up event listeners
            setupEventListeners();
            
            // Initialize sounds
            initSounds();
            
            // Update best score display
            document.getElementById('bestScore').textContent = `Best Score: ${bestScore}`;
            
            // Simulate loading progress
            simulateLoading();
        }
        
        // Initialize sound effects
        function initSounds() {
            // Create audio elements
            flapSound = new Audio();
            hitSound = new Audio();
            pointSound = new Audio();
            
            // Generate simple sound effects using the Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Flap sound - short high frequency beep
                flapSound = generateBeepSound(audioContext, 800, 0.1);
                
                // Hit sound - low frequency thud
                hitSound = generateBeepSound(audioContext, 200, 0.3);
                
                // Point sound - cheerful two-tone sound
                pointSound = generatePointSound(audioContext);
            } catch (e) {
                console.log("Web Audio API not supported, sounds disabled");
                soundEnabled = false;
                document.getElementById('soundToggle').textContent = '🔇';
            }
        }
        
        // Generate a simple beep sound
        function generateBeepSound(audioContext, frequency, duration) {
            return function() {
                if (!soundEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            };
        }
        
        // Generate a two-tone point sound
        function generatePointSound(audioContext) {
            return function() {
                if (!soundEnabled) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            };
        }
        
        // Create color option elements
        function createColorOptions() {
            const birdColorsContainer = document.getElementById('birdColors');
            const pipeColorsContainer = document.getElementById('pipeColors');
            
            // Create bird color options
            birdColorOptions.forEach((color, index) => {
                const colorOption = document.createElement('div');
                colorOption.className = 'colorOption';
                if (index === 0) colorOption.classList.add('selected');
                colorOption.style.backgroundColor = color;
                colorOption.dataset.color = color;
                colorOption.addEventListener('click', () => selectBirdColor(color, colorOption));
                birdColorsContainer.appendChild(colorOption);
            });
            
            // Create pipe color options
            pipeColorOptions.forEach((color, index) => {
                const colorOption = document.createElement('div');
                colorOption.className = 'colorOption';
                if (index === 0) colorOption.classList.add('selected');
                colorOption.style.backgroundColor = color;
                colorOption.dataset.color = color;
                colorOption.addEventListener('click', () => selectPipeColor(color, colorOption));
                pipeColorsContainer.appendChild(colorOption);
            });
        }
        
        // Create game mode option elements
        function createModeOptions() {
            const gameModesContainer = document.getElementById('gameModes');
            
            gameModes.forEach((mode, index) => {
                const modeOption = document.createElement('div');
                modeOption.className = 'modeOption';
                if (index === 0) modeOption.classList.add('selected');
                modeOption.style.background = `linear-gradient(to bottom, ${mode.top}, ${mode.bottom})`;
                modeOption.dataset.mode = mode.id;
                modeOption.innerHTML = `<div style="font-weight:bold;margin-bottom:5px">${mode.name}</div>`;
                modeOption.addEventListener('click', () => selectGameMode(mode, modeOption));
                gameModesContainer.appendChild(modeOption);
            });
        }
        
        // Create background option elements
        function createBackgroundOptions() {
            const backgroundOptionsContainer = document.getElementById('backgroundOptions');
            
            backgroundThemes.forEach((theme, index) => {
                const backgroundOption = document.createElement('div');
                backgroundOption.className = 'backgroundOption';
                if (index === 0) backgroundOption.classList.add('selected');
                backgroundOption.style.background = `linear-gradient(to bottom, ${theme.top}, ${theme.bottom})`;
                backgroundOption.dataset.background = theme.id;
                backgroundOption.innerHTML = `<div style="font-weight:bold">${theme.name}</div>`;
                backgroundOption.addEventListener('click', () => selectBackgroundTheme(theme, backgroundOption));
                backgroundOptionsContainer.appendChild(backgroundOption);
            });
        }
        
        // Create bird size option elements
        function createBirdSizeOptions() {
            const birdSizesContainer = document.getElementById('birdSizes');
            
            birdSizeOptions.forEach((size, index) => {
                const sizeOption = document.createElement('div');
                sizeOption.className = 'sizeOption';
                if (size.id === 'medium') sizeOption.classList.add('selected');
                sizeOption.dataset.size = size.id;
                
                // Create size icon based on size
                let icon = '🐦';
                if (size.id === 'small') icon = '🐤';
                if (size.id === 'large') icon = '🦅';
                
                sizeOption.innerHTML = `
                    <div class="sizeIcon">${icon}</div>
                    <div style="font-weight:bold">${size.name}</div>
                `;
                sizeOption.addEventListener('click', () => selectBirdSize(size, sizeOption));
                birdSizesContainer.appendChild(sizeOption);
            });
        }
        
        // Select bird color
        function selectBirdColor(color, element) {
            bird.color = color;
            document.querySelectorAll('#birdColors .colorOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
        
        // Select pipe color
        function selectPipeColor(color, element) {
            pipeColor = color;
            document.querySelectorAll('#pipeColors .colorOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
        
        // Select game mode
        function selectGameMode(mode, element) {
            currentMode = mode.id;
            backgroundColorTop = mode.top;
            backgroundColorBottom = mode.bottom;
            document.querySelectorAll('#gameModes .modeOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
        
        // Select background theme
        function selectBackgroundTheme(theme, element) {
            currentBackground = theme.id;
            backgroundColorTop = theme.top;
            backgroundColorBottom = theme.bottom;
            document.querySelectorAll('#backgroundOptions .backgroundOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
        
        // Select bird size
        function selectBirdSize(size, element) {
            currentBirdSize = size.id;
            bird.width = size.width;
            bird.height = size.height;
            
            // Adjust gravity and lift based on size for balanced gameplay
            bird.gravity = size.gravity;
            bird.lift = size.lift;
            
            document.querySelectorAll('#birdSizes .sizeOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
        
        // Select difficulty level
        function selectDifficulty(difficulty, element) {
            currentDifficulty = difficulty;
            document.querySelectorAll('#difficultyOptions .difficultyOption').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            
            // Adjust game parameters based on difficulty
            switch(difficulty) {
                case 'easy':
                    pipeSpeed = 1.5;
                    pipeGap = 170;
                    pipeFrequency = 110;
                    break;
                case 'medium':
                    pipeSpeed = 2;
                    pipeGap = 150;
                    pipeFrequency = 100;
                    break;
                case 'hard':
                    pipeSpeed = 2.5;
                    pipeGap = 130;
                    pipeFrequency = 90;
                    break;
            }
        }
        
        // Set up event listeners
        function setupEventListeners() {
            // Start button
            document.getElementById('startButton').addEventListener('click', startGame);
            
            // Customize button
            document.getElementById('customizeButton').addEventListener('click', showCustomization);
            
            // Back button
            document.getElementById('backButton').addEventListener('click', hideCustomization);
            
            // Restart button
            document.getElementById('restartButton').addEventListener('click', restartGame);
            
            // Menu button
            document.getElementById('menuButton').addEventListener('click', showMenu);
            
            // Sound toggle button
            document.getElementById('soundToggle').addEventListener('click', toggleSound);
            
            // Difficulty options
            document.getElementById('difficultyEasy').addEventListener('click', function() {
                selectDifficulty('easy', this);
            });
            document.getElementById('difficultyMedium').addEventListener('click', function() {
                selectDifficulty('medium', this);
            });
            document.getElementById('difficultyHard').addEventListener('click', function() {
                selectDifficulty('hard', this);
            });
            
            // Game controls
            canvas.addEventListener('click', flap);
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    flap();
                    e.preventDefault();
                }
            });
        }
        
        // Toggle sound on/off
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        }
        
        // Simulate loading progress
        function simulateLoading() {
            let progress = 0;
            const progressBar = document.getElementById('progress');
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    setTimeout(() => {
                        document.getElementById('loadingScreen').style.opacity = '0';
                        setTimeout(() => {
                            document.getElementById('loadingScreen').style.display = 'none';
                        }, 500);
                    }, 500);
                }
                progressBar.style.width = progress + '%';
            }, 200);
        }
        
        // Start the game
        function startGame() {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('scoreDisplay').style.display = 'block';
            resetGame();
            gameActive = true;
            gameLoop();
        }
        
        // Show customization screen
        function showCustomization() {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('customizationScreen').style.display = 'flex';
        }
        
        // Hide customization screen
        function hideCustomization() {
            document.getElementById('customizationScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
        }
        
        // Show menu screen
        function showMenu() {
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
            gameActive = false;
        }
        
        // Restart the game
        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('scoreDisplay').style.display = 'block';
            resetGame();
            gameActive = true;
            gameLoop();
        }
        
        // Reset game state
        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            raindrops = [];
            score = 0;
            frames = 0;
            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('newBestScore').style.display = 'none';
        }
        
        // Flap bird wings
        function flap() {
            if (!gameActive) return;
            
            bird.velocity = bird.lift;
            // Play flap sound
            if (flapSound && soundEnabled) {
                flapSound();
            }
        }
        
        // Update game state
        function update() {
            if (!gameActive) return;
            
            frames++;
            
            // Apply gravity to bird
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            
            // Rotate bird based on velocity (smoother rotation)
            bird.rotation = Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.velocity * 0.03));
            
            // Generate new pipes
            if (frames % pipeFrequency === 0) {
                generatePipe();
            }
            
            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                
                // Check if pipe is off screen
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
                
                // Check for scoring
                if (pipes[i].x + pipeWidth === bird.x && !pipes[i].passed) {
                    pipes[i].passed = true;
                    score++;
                    document.getElementById('scoreDisplay').textContent = score;
                    
                    // Play point sound
                    if (pointSound && soundEnabled) {
                        pointSound();
                    }
                }
                
                // Check for collisions
                if (checkCollision(bird, pipes[i])) {
                    gameOver();
                }
            }
            
            // Update rain if in rain mode
            if (currentMode === 'rain') {
                updateRain();
            }
            
            // Check for ground collision
            if (bird.y + bird.height > ground.y) {
                bird.y = ground.y - bird.height;
                gameOver();
            }
            
            // Check for ceiling collision
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }
        }
        
        // Update rain particles
        function updateRain() {
            // Add new raindrops
            if (frames % 5 === 0) {
                raindrops.push({
                    x: Math.random() * canvas.width,
                    y: -10,
                    length: 10 + Math.random() * 20,
                    speed: 5 + Math.random() * 5
                });
            }
            
            // Update existing raindrops
            for (let i = raindrops.length - 1; i >= 0; i--) {
                raindrops[i].y += raindrops[i].speed;
                
                // Remove raindrops that are off screen
                if (raindrops[i].y > canvas.height) {
                    raindrops.splice(i, 1);
                }
            }
        }
        
        // Generate a new pipe
        function generatePipe() {
            let minHeight = 50;
            let maxHeight = ground.y - pipeGap - minHeight;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        // Check collision between bird and pipe
        function checkCollision(bird, pipe) {
            return (
                bird.x < pipe.x + pipeWidth &&
                bird.x + bird.width > pipe.x &&
                (
                    bird.y < pipe.topHeight ||
                    bird.y + bird.height > pipe.topHeight + pipeGap
                )
            );
        }
        
        // Game over
        function gameOver() {
            gameActive = false;
            
            // Play hit sound
            if (hitSound && soundEnabled) {
                hitSound();
            }
            
            // Update best score if needed
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBirdBestScore', bestScore);
                document.getElementById('newBestScore').style.display = 'block';
                document.getElementById('bestScore').textContent = `Best Score: ${bestScore}`;
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('scoreDisplay').style.display = 'none';
            setTimeout(() => {
                document.getElementById('gameOverScreen').style.display = 'flex';
            }, 500);
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sky background
            drawSky();
            
            // Draw background elements based on theme
            drawBackgroundElements();
            
            // Draw clouds (not in night mode)
            if (currentMode !== 'night' && currentBackground !== 'space') {
                drawClouds();
            }
            
            // Draw stars in night mode or space theme
            if (currentMode === 'night' || currentBackground === 'space') {
                drawStars();
            }
            
            // Draw rain in rain mode
            if (currentMode === 'rain') {
                drawRain();
            }
            
            // Draw pipes
            drawPipes();
            
            // Draw ground
            drawGround();
            
            // Draw bird
            drawBird();
        }
        
        // Draw sky background
        function drawSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, backgroundColorTop);
            gradient.addColorStop(1, backgroundColorBottom);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Draw background elements based on theme
        function drawBackgroundElements() {
            switch(currentBackground) {
                case 'mountain':
                    drawMountains();
                    break;
                case 'city':
                    drawCity();
                    break;
                case 'space':
                    drawSpaceElements();
                    break;
                // Default gradient background doesn't need additional elements
            }
        }
        
        // Draw mountains for mountain theme
        function drawMountains() {
            ctx.fillStyle = '#5D4037';
            
            // Draw multiple mountains
            for (let i = 0; i < 3; i++) {
                const x = i * 120 - 30;
                const height = 150 + i * 20;
                
                ctx.beginPath();
                ctx.moveTo(x, ground.y);
                ctx.lineTo(x + 60, ground.y - height);
                ctx.lineTo(x + 120, ground.y);
                ctx.closePath();
                ctx.fill();
                
                // Snow caps
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(x + 40, ground.y - height + 20);
                ctx.lineTo(x + 60, ground.y - height);
                ctx.lineTo(x + 80, ground.y - height + 20);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#5D4037';
            }
        }
        
        // Draw city skyline for city theme
        function drawCity() {
            ctx.fillStyle = '#37474F';
            
            // Draw buildings
            const buildingHeights = [120, 180, 150, 200, 130, 170];
            for (let i = 0; i < buildingHeights.length; i++) {
                const x = i * 60;
                const height = buildingHeights[i];
                
                ctx.fillRect(x, ground.y - height, 50, height);
                
                // Draw windows
                ctx.fillStyle = '#FFD600';
                for (let j = 0; j < 4; j++) {
                    for (let k = 0; k < 3; k++) {
                        if (Math.random() > 0.3) { // Randomly light up windows
                            ctx.fillRect(x + 5 + k * 15, ground.y - height + 10 + j * 25, 10, 15);
                        }
                    }
                }
                ctx.fillStyle = '#37474F';
            }
        }
        
        // Draw space elements for space theme
        function drawSpaceElements() {
            // Draw a planet
            ctx.fillStyle = '#FF9800';
            ctx.beginPath();
            ctx.arc(280, 100, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw a smaller moon
            ctx.fillStyle = '#BDBDBD';
            ctx.beginPath();
            ctx.arc(320, 70, 15, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = currentMode === 'rain' ? 'rgba(200, 200, 200, 0.9)' : 'rgba(255, 255, 255, 0.8)';
            
            // Draw multiple clouds at different positions
            for (let i = 0; i < 5; i++) {
                const x = (frames * 0.5 + i * 100) % (canvas.width + 200) - 100;
                const y = 50 + i * 40;
                drawCloud(x, y, 60 + i * 10);
            }
        }
        
        // Draw a single cloud
        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.3, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.6, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.3, y + size * 0.1, size * 0.4, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
        
        // Draw stars for night mode
        function drawStars() {
            ctx.fillStyle = 'white';
            
            // Draw a fixed set of stars with slight twinkling effect
            const starPositions = [
                {x: 50, y: 80, size: 1},
                {x: 120, y: 150, size: 2},
                {x: 200, y: 60, size: 1},
                {x: 280, y: 120, size: 1},
                {x: 100, y: 200, size: 2},
                {x: 250, y: 180, size: 1},
                {x: 40, y: 250, size: 2},
                {x: 300, y: 250, size: 1}
            ];
            
            starPositions.forEach(star => {
                // Add slight twinkling effect
                const alpha = 0.7 + Math.sin(frames * 0.05 + star.x) * 0.3;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            ctx.globalAlpha = 1;
        }
        
        // Draw rain for rain mode
        function drawRain() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            
            raindrops.forEach(drop => {
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x, drop.y + drop.length);
                ctx.stroke();
            });
        }
        
        // Draw pipes
        function drawPipes() {
            pipes.forEach(pipe => {
                // Draw top pipe
                ctx.fillStyle = pipeColor;
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                
                // Draw pipe cap (top)
                ctx.fillStyle = shadeColor(pipeColor, -30);
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                
                // Draw bottom pipe
                ctx.fillStyle = pipeColor;
                ctx.fillRect(pipe.x, pipe.topHeight + pipeGap, pipeWidth, canvas.height);
                
                // Draw pipe cap (bottom)
                ctx.fillStyle = shadeColor(pipeColor, -30);
                ctx.fillRect(pipe.x - 5, pipe.topHeight + pipeGap, pipeWidth + 10, 20);
            });
        }
        
        // Draw ground - Modified to be solid green and smaller
        function drawGround() {
            // Draw solid green ground
            ctx.fillStyle = '#228B22'; // Solid green color
            ctx.fillRect(0, ground.y, canvas.width, ground.height);
            
            // Draw grass details (simplified for solid look)
            ctx.fillStyle = '#32CD32'; // Slightly lighter green for details
            for (let i = 0; i < canvas.width; i += 15) {
                const height = 3 + Math.sin(frames * 0.1 + i * 0.1) * 2;
                ctx.fillRect(i, ground.y, 5, -height);
            }
        }
        
        // Draw bird with 3D effect
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);
            
            // Bird body
            ctx.fillStyle = bird.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Bird wing (animated)
            ctx.fillStyle = shadeColor(bird.color, -20);
            ctx.beginPath();
            const wingY = Math.sin(frames * 0.3) * 5;
            ctx.ellipse(-bird.width / 4, wingY, bird.width / 3, bird.height / 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Bird eye
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bird.width / 4, -bird.height / 6, bird.width / 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(bird.width / 4 + 2, -bird.height / 6, bird.width / 12, 0, Math.PI * 2);
            ctx.fill();
            
            // Bird beak
            ctx.fillStyle = '#FF8C00';
            ctx.beginPath();
            ctx.moveTo(bird.width / 3, 0);
            ctx.lineTo(bird.width / 2 + 5, -bird.height / 8);
            ctx.lineTo(bird.width / 2 + 5, bird.height / 8);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        // Utility function to shade a color
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1, 3), 16);
            let G = parseInt(color.substring(3, 5), 16);
            let B = parseInt(color.substring(5, 7), 16);
            
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            
            R = (R < 255) ? R : 255;
            G = (G < 255) ? G : 255;
            B = (B < 255) ? B : 255;
            
            R = (R > 0) ? R : 0;
            G = (G > 0) ? G : 0;
            B = (B > 0) ? B : 0;
            
            const RR = R.toString(16).length === 1 ? "0" + R.toString(16) : R.toString(16);
            const GG = G.toString(16).length === 1 ? "0" + G.toString(16) : G.toString(16);
            const BB = B.toString(16).length === 1 ? "0" + B.toString(16) : B.toString(16);
            
            return "#" + RR + GG + BB;
        }
        
        // Main game loop
        function gameLoop() {
            update();
            draw();
            
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }
        
        // Initialize the game when the page loads
        window.onload = init;
    </script>
